<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="joinOverlay" class="overlay">
    <div class="joinCard">
      <h1>Join the board</h1>
      <p class="boardLabel">Board: <span id="boardIdLabel"></span></p>
      <input id="usernameInput" type="text" placeholder="Your name" maxlength="20" autofocus />
      <button id="joinButton">Start drawing</button>
    </div>
  </div>

  <div id="toolbar" class="toolbar hidden">
    <div class="toolGroup">
      <input id="colorPicker" type="color" value="#1e1e1e" title="Stroke color" />
      <input id="sizePicker" type="range" min="1" max="24" value="4" title="Stroke size" />
    </div>
    <div class="toolGroup">
      <button id="undoButton" title="Undo last stroke">Undo</button>
      <button id="clearButton" title="Clear board for everyone">Clear</button>
    </div>
    <div class="toolGroup">
      <span id="statusDot" class="statusDot"></span>
      <span id="statusLabel">Connecting…</span>
    </div>
    <div id="userList" class="userList"></div>
  </div>

  <canvas id="board"></canvas>
  <div id="cursorLayer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
